name: ipro-fo

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        - APP_USER=ipro
        - APP_UID=1000
    container_name: ipro-fo-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
      - REVERB_HOST=reverb
      - MAIL_HOST=mailpit
      - MEILISEARCH_HOST=http://meilisearch:7700
    depends_on:
      redis: { condition: service_healthy }
    networks: [ipro-net]
    expose: ["9000", "8000"]

  nginx:
    image: nginx:1.27-alpine
    container_name: ipro-fo-nginx
    restart: unless-stopped
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:80"
    depends_on: [app]
    networks: [ipro-net]

  # mysql (MariaDB) DIHAPUS — BO/ipro-fo kini memakai jerp-mysql (database ipro_bo)
  # via network shared-db (lihat docker-compose.shared.yml). DB sudah disatukan.

  redis:
    image: redis:7-alpine
    container_name: ipro-fo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [ipro-net]

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ipro-fo-horizon
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: php artisan horizon
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
    depends_on:
      redis: { condition: service_healthy }
    networks: [ipro-net]

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ipro-fo-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: /bin/sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    depends_on:
      redis: { condition: service_healthy }
    networks: [ipro-net]

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ipro-fo-reverb
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    depends_on:
      redis: { condition: service_healthy }
    networks: [ipro-net]

  minio:
    image: minio/minio:latest
    container_name: ipro-fo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9100:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks: [ipro-net]

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: ipro-fo-meili
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    networks: [ipro-net]

  mailpit:
    image: axllent/mailpit:latest
    container_name: ipro-fo-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks: [ipro-net]

networks:
  ipro-net:
    driver: bridge

volumes:
  redis_data:
  minio_data:
  meili_data:
