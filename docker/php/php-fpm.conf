; J-ERP PHP-FPM pool config (overrides image default)
[www]
user = www-data
group = www-data

listen = 0.0.0.0:9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

pm.status_path = /status
ping.path = /ping
ping.response = pong

; Pass through Laravel envs (don't clear)
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
