; J-ERP PHP runtime config (override defaults)
date.timezone = Asia/Jakarta

memory_limit = 512M
max_execution_time = 120
max_input_time = 120

upload_max_filesize = 50M
post_max_size = 60M
max_file_uploads = 30

; Display
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; OPcache — DEV hybrid: validate_timestamps=1 + revalidate_freq=2.
; PHP mengecek mtime file maksimal tiap 2 detik (bukan tiap request), jadi
; edit PHP/Blade otomatis tampil dalam ~2 detik TANPA restart app, dengan
; overhead stat() yang jauh lebih ringan dari validasi penuh tiap request.
; PROD: set validate_timestamps=0 (container fresh tiap deploy = opcache bersih).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1

; Session (Redis-backed via Laravel; keep PHP session minimal)
session.gc_maxlifetime = 1440

; Realpath cache (helps autoloader perf)
realpath_cache_size = 8192K
realpath_cache_ttl = 600

; Expose less
expose_php = Off
