server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # Healthcheck (used by compose + reverse proxy)
    location = /up {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    # Long-cache built assets (Vite emits hashed filenames)
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Public uploads (storage:link)
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # Reverb (Laravel WebSockets, protokol Pusher) — real-time siteplan/siteplanlive
    # & PetaUnitLive. Client konek ke /app/{key}; diteruskan ke service reverb
    # (container, port 8088) dgn upgrade WebSocket. Lewat reverse proxy / Cloudflare
    # Tunnel: wss://<host>/app → sampai sini → reverb. (Tidak ada route Laravel /app.)
    location /app {
        proxy_pass http://reverb:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # App approver PWA (Flutter, hasil build di public/approver — mobile/jerp_pwa/build-server.sh).
    # WAJIB ^~ dan lebih panjang dari "/app": tanpa ini prefix /app di atas juga cocok dengan
    # /approver/... dan semuanya diteruskan ke reverb (404 "Not found."). no-cache = selalu
    # cek versi baru (ETag), supaya PWA yang terpasang tidak tertahan di build lama.
    location = /approver {
        return 301 /approver/;
    }
    location ^~ /approver/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /approver/index.html;
    }

    # App portal Legal (Next.js, basePath /legal) — SSO dari J-ERP (/sso/to-legal).
    # $http_host (BUKAN $host): sertakan port supaya redirect Next kembali ke
    # origin publik, bukan localhost:3000 internal container.
    # proxy_pass memakai VARIABEL, bukan nama langsung, DENGAN SENGAJA. Nginx
    # me-resolve nama upstream saat MEMUAT konfigurasi; bila container `legal`
    # belum ada, nginx menolak start ("host not found in upstream") sehingga
    # SELURUH FO ikut mati — portal yang tumbang menjatuhkan aplikasi utama.
    # Dengan variabel + resolver, resolusi ditunda ke waktu permintaan: nginx
    # tetap hidup, hanya /legal yang 502 sampai portalnya dinaikkan.
    location /legal {
        resolver 127.0.0.11 valid=10s ipv6=off;   # DNS internal Docker
        set $upstream_legal http://legal:3000;
        proxy_pass $upstream_legal;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 20m;   # upload dokumen legal (server actions 15mb)
    }

    # App portal Sales — Java Sales Hub (Next.js, basePath /sales)
    # Variabel + resolver — alasan sama seperti /legal di atas.
    location /sales {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_sales http://sales:3000;
        proxy_pass $upstream_sales;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA-style fallback to Laravel front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP FastCGI
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS $https if_not_empty;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120s;
    }

    # Deny dotfiles
    location ~ /\.(?!well-known) {
        deny all;
    }
}
