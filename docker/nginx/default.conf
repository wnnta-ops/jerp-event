server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # Healthcheck (used by compose + reverse proxy)
    location = /up {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    # Long-cache built assets (Vite emits hashed filenames)
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Public uploads (storage:link)
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # Reverb (Laravel WebSockets, protokol Pusher) — real-time siteplan/siteplanlive
    # & PetaUnitLive. Client konek ke /app/{key}; diteruskan ke service reverb
    # (container, port 8088) dgn upgrade WebSocket. Lewat reverse proxy / Cloudflare
    # Tunnel: wss://<host>/app → sampai sini → reverb. (Tidak ada route Laravel /app.)
    location /app {
        proxy_pass http://reverb:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA-style fallback to Laravel front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP FastCGI
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS $https if_not_empty;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120s;
    }

    # Deny dotfiles
    location ~ /\.(?!well-known) {
        deny all;
    }
}
