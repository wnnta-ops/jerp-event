# J-ERP — docker-compose.yml (base / dev-ready)
#
# Run:
#   docker compose up -d
#   docker compose exec app php artisan migrate --seed
#
# Production: gabungkan dengan docker-compose.prod.yml
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Template ini disertakan di snapshot folder; salin ke root repo Laravel target J-ERP.

name: jerp

networks:
  jerp:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  meili-data:
  pg-data:          # PostgreSQL — DB app portal Legal & Sales (Next.js + Prisma)
  # Produksi (base): image immutable + named volume untuk data yang persist.
  # Dev meng-override volume ini dgn bind-mount source (docker-compose.override.yml).
  storage:
  bootstrap-cache:
  legal-uploads:    # Legal — berkas dokumen yang diunggah (public/uploads)
  legal-docs:       # Legal — berkas pemenuhan Permintaan (privat, di luar public/)

x-app-env: &app-env
  APP_NAME: "Java Core"
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_URL: ${APP_URL:-http://localhost:8080}
  APP_TIMEZONE: Asia/Jakarta
  APP_LOCALE: id
  APP_FALLBACK_LOCALE: en
  # APP_KEY SENGAJA tidak di-set di sini supaya Laravel membacanya dari file .env
  # yang di-mount (./.env). Entrypoint produksi auto-generate bila masih kosong.

  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-jerp}
  DB_USERNAME: ${DB_USERNAME:-jerp}
  DB_PASSWORD: ${DB_PASSWORD:-secret}

  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PREFIX: jerp

  CACHE_STORE: redis
  SESSION_DRIVER: database
  QUEUE_CONNECTION: redis
  BROADCAST_CONNECTION: reverb

  MEILISEARCH_HOST: http://meilisearch:7700
  MEILISEARCH_KEY: ${MEILISEARCH_KEY:-masterKey}
  SCOUT_DRIVER: meilisearch

  REVERB_APP_ID: ${REVERB_APP_ID:-jerp}
  REVERB_APP_KEY: ${REVERB_APP_KEY:-jerpkey}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:-jerpsecret}
  REVERB_HOST: reverb
  REVERB_PORT: 8088
  REVERB_SCHEME: http

# VITE_* HARUS tersedia saat BUILD (Vite menanamnya ke bundle app.js). Tanpa ini,
# window.Echo (real-time Reverb) & reCAPTCHA tak aktif di image produksi. Anchor
# ini di-merge ke build args SEMUA service yang memicu node-build, supaya aset
# selalu konsisten (tak tertimpa build tanpa VITE). Default = nilai dev/localhost;
# untuk produksi set di .env: VITE_REVERB_HOST=<domain>, VITE_REVERB_SCHEME=https,
# VITE_REVERB_PORT=443.
x-vite-args: &vite-args
  VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY:-jerpkey}
  VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
  VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8088}
  VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
  VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-}
  VITE_APP_NAME: ${VITE_APP_NAME:-Java Core}

services:
  # ───────────────────────────────────────────────────────────────────
  # Application — PHP-FPM (Laravel)
  # ───────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        <<: *vite-args
        APP_VERSION: ${APP_VERSION:-dev}
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
        # Chromium/PDF opsional — default OFF (build cepat, hemat RAM VPS).
        # Set INSTALL_CHROMIUM=true di .env saat butuh PDF Browsershot.
        INSTALL_CHROMIUM: ${INSTALL_CHROMIUM:-false}
    image: jerp/app:${APP_VERSION:-latest}
    container_name: jerp-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment:
      <<: *app-env
    volumes:
      # Produksi: image immutable. Hanya data persist + .env yang dari host.
      # (Dev meng-override jadi bind-mount source di docker-compose.override.yml.)
      - storage:/var/www/html/storage
      - bootstrap-cache:/var/www/html/bootstrap/cache
      - ./.env:/var/www/html/.env
    expose:
      - "9000"
    networks:
      - jerp
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Boot pertama berat (migrate + config:cache + filament:optimize) bisa 60-90s
      # sebelum php-fpm siap. Beri tenggang besar supaya container tidak keburu
      # di-cap "unhealthy" → bikin nginx (depends_on healthy) gagal start saat `up`.
      start_period: 150s

  # ───────────────────────────────────────────────────────────────────
  # Web — Nginx serving static + FastCGI
  # ───────────────────────────────────────────────────────────────────
  nginx:
    # Produksi: image `web` (Dockerfile stage) berisi nginx + public/ + aset Vite.
    # Dev meng-override jadi nginx:alpine + bind-mount source (override file).
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        <<: *vite-args
    image: jerp/web:${APP_VERSION:-latest}
    container_name: jerp-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      # Upload publik (siteplan dll) di-serve via symlink /storage → volume ini.
      - storage:/var/www/html/storage:ro
    networks:
      - jerp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ───────────────────────────────────────────────────────────────────
  # Queue worker — Horizon
  # ───────────────────────────────────────────────────────────────────
  horizon:
    # Build sama dgn app supaya `up --build` di mesin baru TIDAK mencoba pull
    # jerp/app dari registry. Compose build sekali, semua service reuse image-nya.
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        <<: *vite-args
        INSTALL_CHROMIUM: ${INSTALL_CHROMIUM:-false}
    image: jerp/app:${APP_VERSION:-latest}
    container_name: jerp-horizon
    restart: unless-stopped
    depends_on:
      - app
      - redis
    environment:
      <<: *app-env
      CONTAINER_ROLE: horizon
    volumes:
      - storage:/var/www/html/storage
      - bootstrap-cache:/var/www/html/bootstrap/cache
      - ./.env:/var/www/html/.env
    command: ["php", "artisan", "horizon"]
    networks:
      - jerp
    healthcheck:
      # `php artisan horizon:status` cold-boots Laravel which takes 10s+ on first run.
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s

  # ───────────────────────────────────────────────────────────────────
  # Scheduler — Laravel artisan schedule:run tiap 60s
  # ───────────────────────────────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        <<: *vite-args
        INSTALL_CHROMIUM: ${INSTALL_CHROMIUM:-false}
    image: jerp/app:${APP_VERSION:-latest}
    container_name: jerp-scheduler
    restart: unless-stopped
    depends_on:
      - app
    environment:
      <<: *app-env
      CONTAINER_ROLE: scheduler
    volumes:
      - storage:/var/www/html/storage
      - bootstrap-cache:/var/www/html/bootstrap/cache
      - ./.env:/var/www/html/.env
    # Loop tiap menit, run scheduler. Alternatif: cron classic.
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          php artisan schedule:run --verbose --no-interaction >> /var/www/html/storage/logs/scheduler.log 2>&1
          sleep 60
        done
    networks:
      - jerp
    healthcheck:
      # Just verify the wrapping shell loop is alive (PID 1 is sh running our while loop)
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ───────────────────────────────────────────────────────────────────
  # Reverb — WebSocket server (Launching live unit, notifikasi)
  # ───────────────────────────────────────────────────────────────────
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        <<: *vite-args
        INSTALL_CHROMIUM: ${INSTALL_CHROMIUM:-false}
    image: jerp/app:${APP_VERSION:-latest}
    container_name: jerp-reverb
    restart: unless-stopped
    depends_on:
      - app
    environment:
      <<: *app-env
      CONTAINER_ROLE: reverb
    volumes:
      - storage:/var/www/html/storage
      - bootstrap-cache:/var/www/html/bootstrap/cache
      - ./.env:/var/www/html/.env
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8088"]
    ports:
      - "${REVERB_PORT:-8088}:8088"
    networks:
      - jerp
    healthcheck:
      # Any HTTP response (incl. 404) means the port is open and Reverb is serving.
      test: ["CMD-SHELL", "curl -fso /dev/null --max-time 2 -w '%{http_code}' http://127.0.0.1:8088/ | grep -q '^[0-9]'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ───────────────────────────────────────────────────────────────────
  # MySQL 8
  # ───────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: jerp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_DATABASE:-jerp}
      MYSQL_USER: ${DB_USERNAME:-jerp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      TZ: Asia/Jakarta
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=512M
      - --max-connections=200
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    networks:
      - jerp
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ───────────────────────────────────────────────────────────────────
  # Redis 7
  # ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: jerp-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - jerp
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ───────────────────────────────────────────────────────────────────
  # Meilisearch — search (customer/unit/kontrak autocomplete)
  # ───────────────────────────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: jerp-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-masterKey}
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data
    ports:
      - "${MEILI_PORT:-7700}:7700"
    networks:
      - jerp
    healthcheck:
      # Meilisearch image has no curl/wget — use embedded binary's health endpoint
      # via a simple TCP probe (port-open is sufficient for readiness).
      test: ["CMD-SHELL", "curl -fsS http://localhost:7700/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ───────────────────────────────────────────────────────────────────
  # PostgreSQL — DB untuk app portal Legal & Sales (Next.js + Prisma).
  # Dua database dibuat oleh init script (docker/postgres/init).
  # ───────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: jerp-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-jerp}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-pgsecret}
      POSTGRES_DB: ${PG_DB:-jerp}
      TZ: Asia/Jakarta
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - jerp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ───────────────────────────────────────────────────────────────────
  # Legal — app portal (Next.js 14 + Prisma/Postgres), diakses via
  # jerp-nginx path /legal. Login lewat SSO J-ERP (/sso/to-legal).
  # ───────────────────────────────────────────────────────────────────
  legal:
    build:
      context: ./app/legal
      dockerfile: Dockerfile
    image: jerp/legal:${APP_VERSION:-latest}
    container_name: jerp-legal
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${PG_USER:-jerp}:${PG_PASSWORD:-pgsecret}@postgres:5432/legal
      AUTH_SECRET: ${LEGAL_AUTH_SECRET:-dev-legal-secret-change-me}
      JERP_SSO_SECRET: ${PORTAL_SSO_SECRET:-dev-portal-sso-secret}
      # Jembatan dokumen AJB → SPR (Final) di Marketing & Sales & Detail AJB di BO.
      # HARUS URL INTERNAL: service `app` adalah PHP-FPM port 9000 (bukan HTTP), jadi
      # yang dituju nginx. Kuncinya diturunkan dari JERP_SSO_SECRET di atas — tidak
      # ada variabel baru yang wajib diisi (lihat lib/jerp-bridge.ts & config/ipro.php).
      JERP_BASE_URL: ${JERP_INTERNAL_URL:-http://nginx}
      # Secret callback approval eksternal (GM→Direktur→Owner). Endpoint fail-closed:
      # tanpa nilai ini, /api/external-approval menolak semua request.
      EXTERNAL_APPROVAL_SECRET: ${LEGAL_EXTERNAL_APPROVAL_SECRET:-dev-legal-extapproval-secret}
      # Berkas pemenuhan Permintaan. JANGAN /tmp — isinya lenyap tiap container
      # dibuat ulang (dan bisa dibersihkan OS). Diarahkan ke named volume.
      REQUEST_DOCS_DIR: /app/storage/request-docs
      NODE_ENV: production
    volumes:
      # Berkas dokumen legal ditulis ke DISK container, bukan DB. Tanpa named
      # volume, SETIAP rebuild/recreate (mis. up-portal.sh) menghapus seluruh
      # dokumen yang sudah diunggah.
      - legal-uploads:/app/public/uploads
      - legal-docs:/app/storage/request-docs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jerp

  # ───────────────────────────────────────────────────────────────────
  # Sales — Java Sales Hub (Next.js 15 + NextAuth + Prisma/Postgres),
  # diakses via jerp-nginx path /sales. Login lewat SSO J-ERP (/sso/to-sales).
  # ───────────────────────────────────────────────────────────────────
  sales:
    build:
      context: ./app/sales
      dockerfile: Dockerfile
    image: jerp/sales:${APP_VERSION:-latest}
    container_name: jerp-sales
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${PG_USER:-jerp}:${PG_PASSWORD:-pgsecret}@postgres:5432/sales
      NEXTAUTH_SECRET: ${SALES_NEXTAUTH_SECRET:-dev-sales-secret-change-me}
      NEXTAUTH_URL: ${SALES_NEXTAUTH_URL:-http://localhost:8081/sales/api/auth}
      JERP_SSO_SECRET: ${PORTAL_SSO_SECRET:-dev-portal-sso-secret}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jerp
