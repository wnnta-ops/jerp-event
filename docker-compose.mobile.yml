# Expo dev server untuk App Approver (mobile/approval_flow) — Node 20.
#
# Jalankan (satu perintah):
#   docker compose -f docker-compose.mobile.yml up -d
# Lihat QR / URL untuk Expo Go:
#   docker logs -f jerp-mobile          # scan QR / buka exp://... di Expo Go
# Stop:
#   docker compose -f docker-compose.mobile.yml down
#
# Mode tunnel (default) → HP bisa connect dari jaringan mana pun (lewat ngrok),
# tak perlu buka firewall. API tetap dipanggil HP ke domain produksi (src/config.ts).
#
# Project terpisah (`name`) supaya `down`/`--remove-orphans` TIDAK menyentuh stack
# utama J-ERP.
name: jerp-mobile

services:
  mobile:
    image: node:20-bookworm-slim
    container_name: jerp-mobile
    working_dir: /app
    volumes:
      - ./mobile/approval_flow:/app
      - mobile_node_modules:/app/node_modules
    ports:
      - "9091:8081"   # Metro (dipakai kalau mode LAN, lihat catatan di bawah)
    environment:
      EXPO_NO_TELEMETRY: "1"
      # Mode LAN (alternatif tunnel): set IP/domain server lalu ganti command ke
      # "npx expo start --port 8081" + buka port 9091 di firewall.
      # REACT_NATIVE_PACKAGER_HOSTNAME: "j-erp.anisaproperti.com"
    command: >
      sh -c "([ -d node_modules/expo ] || npm install) &&
             ([ -d node_modules/@expo/ngrok ] || npm install --no-save @expo/ngrok@^4.1.0) &&
             npx expo start --port 8081 --tunnel"
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  mobile_node_modules:
    name: jerp_mobile_node_modules   # nama tetap → reuse install antar-project
